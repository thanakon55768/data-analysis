[project]
name = "ai-data-analyst-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2.2,<4", "numpy>=2,<3", "python-calamine==0.9.1", "openpyxl>=3.1,<4", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "httpx2>=2.16,<3", "ruff>=0.17,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
